<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Codex Terminal — hors connexion</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100dvh; margin: 0; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); place-items: center; background: #050505; color: #f5f5f5; }
      main { width: min(420px, 100%); text-align: center; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0 0 24px; color: #aaa; line-height: 1.55; }
      button { min-height: 48px; padding: 0 22px; border: 1px solid #444; border-radius: 10px; background: #f5f5f5; color: #050505; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Serveur indisponible</h1>
      <p>Codex Terminal a besoin du serveur pour lancer les terminaux. Verifie Tailscale et ta connexion, puis reessaie.</p>
      <button type="button" onclick="location.reload()">Reessayer</button>
    </main>
  </body>
</html>

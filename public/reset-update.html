<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Mise à jour de Codex Terminal</title>
    <style>
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #080808; color: #eee; font: 15px system-ui, sans-serif; }
      main { padding: 24px; text-align: center; }
      strong { display: block; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <main><strong>Mise à jour de l’interface web…</strong><span>Rechargement automatique.</span></main>
    <script>
      (async () => {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        window.location.replace("/?terminal-mouse-update=3");
      })().catch(() => window.location.replace("/?terminal-mouse-update=3"));
    </script>
  </body>
</html>

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true

# La seule plateforme SDK installee sur ce poste est android-36, donc on
# compile contre l'API 36. AGP 8.7 ne "connait" pas encore cette API : on
# supprime l'avertissement bloquant (aucune fonctionnalite API 36 n'est utilisee).
android.suppressUnsupportedCompileSdk=36
